<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎬</div>
      <h1>Smart Movie AI</h1>
      <p>Angular Web Client - SOA Architecture</p>
    </div>

    <!-- Trang đã đăng nhập -->
    <div *ngIf="currentUser" style="text-align: center;">
      <div class="alert-message alert-success">
        🎉 Bạn đang đăng nhập: <strong>{{ currentUser.name }}</strong>
        <span class="user-badge" [ngClass]="currentUser.role === 'ADMIN' ? 'badge-admin' : 'badge-user'">
          {{ currentUser.role }}
        </span>
      </div>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
        Email: {{ currentUser.email }}
      </p>
      <button className="btn-submit" (click)="logout()">
        🚪 Đăng Xuất
      </button>
    </div>

    <!-- Form Đăng Nhập / Đăng Ký -->
    <div *ngIf="!currentUser">
      <div class="auth-tabs">
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'login'" 
          (click)="switchTab('login')">
          Đăng Nhập
        </button>
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'register'" 
          (click)="switchTab('register')">
          Đăng Ký
        </button>
      </div>

      <div *ngIf="message.text" class="alert-message" [ngClass]="message.type === 'error' ? 'alert-error' : 'alert-success'">
        {{ message.text }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <div *ngIf="activeTab === 'register'" class="form-group">
          <label>Họ và Tên</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              name="name" 
              class="form-input" 
              placeholder="Phan Nguyễn Gia Huy"
              [(ngModel)]="formData.name" 
              required>
          </div>
        </div>

        <div class="form-group">
          <label>Địa chỉ Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input 
              type="email" 
              name="email" 
              class="form-input" 
              placeholder="user@smartmovie.ai"
              [(ngModel)]="formData.email" 
              required>
          </div>
        </div>

        <div class="form-group">
          <label>Mật Khẩu</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••"
              [(ngModel)]="formData.password" 
              required>
          </div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="loading">
          {{ loading ? 'Đang xử lý...' : (activeTab === 'login' ? '🔑 Đăng Nhập' : '📝 Tạo Tài Khoản') }}
        </button>
      </form>
    </div>
  </div>
</div>
