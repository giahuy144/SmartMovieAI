<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-box" style="position: relative; max-width: 480px; padding: 2.2rem;">
    <button class="modal-close" (click)="closeModal.emit()" title="Đóng">✕</button>

    <!-- Logo & Header -->
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎬</div>
      <h2 style="font-size: 1.5rem; font-weight: 900; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
        SmartMovie AI
      </h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">
        {{ activeTab === 'login' ? 'Đăng nhập để trải nghiệm AI cá nhân hóa' : 'Đăng ký tài khoản mới chỉ trong vài giây' }}
      </p>
    </div>

    <!-- Tab Switcher -->
    <div class="auth-tabs" style="margin-bottom: 1.5rem;">
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab === 'login'"
        (click)="switchTab('login')"
      >🔑 Đăng Nhập</button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab === 'register'"
        (click)="switchTab('register')"
      >✨ Đăng Ký</button>
    </div>

    <!-- Alert Notification -->
    <div *ngIf="message" class="alert-message"
      [class.alert-error]="messageType === 'error'"
      [class.alert-success]="messageType === 'success'"
      style="margin-bottom: 1.2rem;">
      <span>{{ messageType === 'error' ? '⚠️' : '✅' }}</span>
      {{ message }}
    </div>

    <!-- Form Inputs -->
    <form (ngSubmit)="submit()" autocomplete="off">
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="modalUserName" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">
          Tên Tài Khoản
        </label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            id="modalUserName"
            name="userName"
            class="form-input"
            type="text"
            placeholder="Nhập tên tài khoản..."
            [(ngModel)]="formData.userName"
            required
          />
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="modalPassword" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">
          Mật Khẩu
        </label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="modalPassword"
            name="password"
            class="form-input"
            [type]="showPass ? 'text' : 'password'"
            placeholder="Nhập mật khẩu..."
            [(ngModel)]="formData.password"
            required
          />
          <button type="button"
            style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem;"
            (click)="showPass = !showPass">
            {{ showPass ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <!-- Confirm Password (Register tab) -->
      <div class="form-group" *ngIf="activeTab === 'register'" style="margin-bottom: 1rem;">
        <label for="modalConfirmPassword" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">
          Xác Nhận Mật Khẩu
        </label>
        <div class="input-wrapper">
          <span class="input-icon">🔐</span>
          <input
            id="modalConfirmPassword"
            name="confirmPassword"
            class="form-input"
            [type]="showPass ? 'text' : 'password'"
            placeholder="Nhập lại mật khẩu..."
            [(ngModel)]="formData.confirmPassword"
            required
          />
        </div>
      </div>

      <!-- Password Strength Meter -->
      <div *ngIf="activeTab === 'register' && formData.password" style="margin-bottom: 1rem;">
        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
          <div *ngFor="let i of [1,2,3,4]"
            style="height: 3px; flex: 1; border-radius: 2px; transition: all 0.3s ease;"
            [style.background]="getPasswordStrengthColor(i)">
          </div>
        </div>
        <div style="font-size: 0.72rem; color: var(--text-muted);">
          Độ mạnh: <span [style.color]="getPasswordStrengthLabel().color">{{ getPasswordStrengthLabel().text }}</span>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading" style="width: 100%; margin-top: 0.5rem; justify-content: center; padding: 0.85rem;">
        <span *ngIf="loading" style="display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(9,13,22,0.4); border-top-color: #090d16; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px;"></span>
        {{ loading ? 'Đang xử lý...' : (activeTab === 'login' ? '🚀 Đăng Nhập' : '✨ Tạo Tài Khoản') }}
      </button>
    </form>

    <!-- Social Logins -->
    <div class="auth-divider" style="margin: 1.5rem 0 1rem;">Hoặc tiếp tục với</div>
    <div class="social-login-grid">
      <button type="button" class="btn-social" title="Đăng nhập Google">
        <span>🌐</span> Google
      </button>
      <button type="button" class="btn-social" title="Đăng nhập Facebook">
        <span>📘</span> Facebook
      </button>
      <button type="button" class="btn-social" title="Đăng nhập X (Twitter)">
        <span>✖️</span> X
      </button>
    </div>
  </div>
</div>
