<div class="modal-backdrop" *ngIf="movie" (click)="onBackdropClick($event)">
  <div class="modal-box" style="position: relative;">
    <button class="modal-close" (click)="closeModal.emit()">✕</button>

    <div style="position: relative; padding-top: 45%; overflow: hidden; border-radius: var(--radius-lg) var(--radius-lg) 0 0;">
      <img [src]="movie.poster" [alt]="movie.title"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"
        (error)="onImgError($event)" />
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-card) 0%, transparent 60%);"></div>

      <div style="position: absolute; bottom: 1.5rem; left: 1.5rem;">
        <div class="badge badge-purple" style="margin-bottom: 0.5rem;">{{ movie.genre }}</div>
        <h2 style="font-size: 1.8rem; font-weight: 900;">{{ movie.title }}</h2>
      </div>
    </div>

    <div style="padding: 1.5rem 2rem 2rem;">
      <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.2rem; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 6px; color: var(--accent-gold); font-weight: 700;">
          ⭐ {{ movie.averageRating || '8.5' }} / 10
        </div>
        <div style="color: var(--text-muted); font-size: 0.875rem;">🎬 {{ movie.director }}</div>
        <div style="color: var(--text-muted); font-size: 0.875rem;">📅 {{ movie.releaseDate }}</div>
        <div style="color: var(--text-muted); font-size: 0.875rem;">⏱️ {{ movie.duration }} phút</div>
      </div>

      <p style="color: var(--text-muted); line-height: 1.7; font-size: 0.92rem; margin-bottom: 1.5rem;">
        {{ movie.description }}
      </p>

      <div *ngIf="movie.aiReason" class="movie-ai-reason" style="margin-bottom: 1.5rem; font-size: 0.85rem; padding: 0.85rem 1rem;">
        🤖 AI Lý Do Đề Xuất: {{ movie.aiReason }}
      </div>

      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <a [href]="movie.trailer" target="_blank" class="btn-primary">
          ▶ Xem Trailer
        </a>
        <button class="btn-secondary" (click)="toggleFavorite.emit(movie)">
          {{ isFavorite ? '❤️ Đã Yêu Thích' : '🤍 Yêu Thích' }}
        </button>
        <button class="btn-ghost" (click)="analyzeAi.emit(movie)">
          🔬 Phân Tích AI
        </button>
      </div>
    </div>
  </div>
</div>
